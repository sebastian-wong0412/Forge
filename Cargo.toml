[workspace]
resolver = "3"
members = [
    "crates/forge-domain",
    "crates/forge-application",
    "crates/forge-server",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
forge-domain = { path = "crates/forge-domain" }
forge-application = { path = "crates/forge-application" }

axum = "0.8"
dotenvy = "0.15"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["std", "v7"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
